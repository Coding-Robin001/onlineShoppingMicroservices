server:
  port: 9000

spring:
  application:
    name: onlineShoppingMicroservices-Api-Gateway
gateway:
  routes:
    product: "http://localhost:8083"
    order: "http://localhost:8084"
    inventory: "http://localhost:8085"

swagger:
  routes:
    product: "http://localhost:8083/v3/api-docs"
    order: "http://localhost:8084/v3/api-docs"
    inventory: "http://localhost:8085/v3/api-docs"

springdoc:
  api-docs:
    enabled: true
    path: "/api-docs"  # Main API docs path for the Gateway
  swagger-ui:
    enabled: true
    path: "/swagger-ui"  # URL for Swagger UI
    urls:
      - name: "Order Service"
        url: "/api-docs/order"
      - name: "Product Service"
        url: "/api-docs/product"
      - name: "Inventory Service"
        url: "/api-docs/inventory"


management:
  observation:
    key-values:
      application: api-gateway
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # Enable histogram for these metrics
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - metrics
        - prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

loki:
  url: http://localhost:3100/loki/api/v1/push


resilience4j:
  circuitbreaker:
    config:
      defaults:
        registerHealthIndicator: true  # Enables Actuator health monitoring
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        slowCallRateThreshold: 30
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimumNumberOfCalls: 5

  timelimiter:
    config:
      defaults:
        timeoutDuration: 3s  # Requests taking longer than 3s will time out
        cancelRunningFuture: true  # Cancels the ongoing request if it times out

  retry:
    config:
      defaults:
        maxAttempts: 3         # Maximum number of retry attempts
        waitDuration: 2s       # Wait time between retries
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException


