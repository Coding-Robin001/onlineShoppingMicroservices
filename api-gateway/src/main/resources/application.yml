server:
  port: 9000

spring:
  application:
    name: onlineShoppingMicroservices-Api-Gateway

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    urls:
      - name: Order Service
        url: http://localhost:8084/v3/api-docs
      - name: Product Service
        url: http://localhost:8083/v3/api-docs
      - name: Inventory Service
        url: http://localhost:8085/v3/api-docs
