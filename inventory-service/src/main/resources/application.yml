
server:
  port: 8085

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:3308/inventory_service_schema
    username: root
    password: Adewole171200
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html


management:
  observation:
    key-values:
      application: product-service
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # Enable histogram for these metrics
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

loki:
  url: http://localhost:3100/loki/api/v1/push